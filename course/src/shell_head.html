<title>Data Lineage Self-Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky top bar with a week DAG; left rail of weeks on wide screens; one reading column for content. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#EAEEF2; --ink:#14202B; --muted:#56677A; --line:#D6DEE6;
  --accent:#0B7A69; --accent-ink:#FFFFFF; --accent-soft:#DCF0EB;
  --mark:#A8520E; --mark-soft:#FBEADB;
  --good:#1E7A3B; --good-soft:#DFF2E5; --bad:#B42318; --bad-soft:#FBE3E1; --warn:#9A5B00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E27; --sunk:#1B2631; --ink:#E4ECF2; --muted:#93A5B6; --line:#2A3947;
  --accent:#3BC3A8; --accent-ink:#04201A; --accent-soft:#123630;
  --mark:#F0A462; --mark-soft:#3A2717;
  --good:#5CC27B; --good-soft:#163222; --bad:#F2766B; --bad-soft:#3A1B19; --warn:#E7B060;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E27; --sunk:#1B2631; --ink:#E4ECF2; --muted:#93A5B6; --line:#2A3947;
  --accent:#3BC3A8; --accent-ink:#04201A; --accent-soft:#123630;
  --mark:#F0A462; --mark-soft:#3A2717;
  --good:#5CC27B; --good-soft:#163222; --bad:#F2766B; --bad-soft:#3A1B19; --warn:#E7B060;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--f-mono);font-size:.88em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.dag{flex:1 1 260px;min-width:0;max-width:420px}
.dag svg{width:100%;height:34px;display:block}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--mark);color:var(--surface);font-size:12px;text-align:center}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:var(--r)}
.wk:hover{background:var(--sunk)}
.wk[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.wk .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wk .t{font-size:14px;line-height:1.25}
.wk .bar{grid-column:2;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.wk .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)} .rail{display:none}}
.status{margin-top:14px;font-size:12px;color:var(--muted)}
.mobile-weeks{display:none;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
@media (max-width:860px){.mobile-weeks{display:flex}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft)}

main{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1;letter-spacing:-.02em;margin:.2em 0 .3em;text-wrap:balance}
h2{font-size:21px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{font-family:var(--f-read);font-size:17px;color:var(--muted);max-width:66ch;margin:0}
.goal{margin:14px 0 0;max-width:70ch;font-size:14px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface)}

.budget{margin:18px 0 8px}
.budget-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.budget-bar span{display:block;height:100%}
.budget-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.budget-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.tabular{font-variant-numeric:tabular-nums}

.step{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.step-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.step-n{font-family:var(--f-mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);flex:none}
.step.done .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-h h2{flex:1 1 150px;min-width:0}
.step-h .why{flex-basis:100%;margin:0 0 0 38px;font-size:13px;color:var(--muted)}
.step-b{padding:16px}
.donebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.step.done .donebtn{border-color:var(--accent);color:var(--accent)}
.recall-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mark);background:var(--mark-soft);padding:2px 8px;border-radius:999px}

.reads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.reads li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start}
.reads input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.reads .w{font-weight:600}
.reads .where{font-size:13px;color:var(--muted)}
.reads .note{font-family:var(--f-read);font-size:14.5px;margin-top:2px}
.reads .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.notes{font-family:var(--f-read);font-size:16.5px;line-height:1.62;max-width:72ch}
.notes h3{font-family:var(--f-display);font-size:18px;margin:1.6em 0 .4em;letter-spacing:-.01em}
.notes h3:first-child{margin-top:0}
.notes p{margin:.6em 0}
.notes ul,.notes ol{padding-left:1.3em;margin:.5em 0}
.notes li{margin:.25em 0}
.aside{font-size:14px;color:var(--muted);font-style:italic}
.callout{margin:1em 0;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r);font-size:15.5px}
.tscroll,.notes .t{overflow-x:auto}
table.t{border-collapse:collapse;font-family:var(--f-display);font-size:14px;margin:.8em 0;display:block;overflow-x:auto;max-width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{font-weight:600;background:var(--sunk)}
table.t.mono{font-family:var(--f-mono);font-size:13px}
.tid{color:var(--mark);font-weight:600}
.dbfig{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;margin:0 0 1em;padding:12px;background:var(--sunk);border-radius:var(--r)}
.dbcap{flex-basis:100%;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.dbfig table.t{margin:0;background:var(--surface)}
pre.code,.diagram{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--sunk);border-radius:var(--r);padding:12px 14px;overflow-x:auto;white-space:pre;margin:.8em 0;color:var(--ink)}
.closebook{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.collapsed .notes{display:none}

.items{display:flex;flex-direction:column;gap:14px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.item .q{font-weight:600;margin:0 0 8px}
.item.task .q{font-weight:600}
.item .body{font-family:var(--f-read);font-size:15.5px}
.item .body p{margin:.4em 0}
textarea{width:100%;min-height:76px;resize:vertical;font:15px/1.5 var(--f-read);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
textarea:focus{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.mark{background:var(--mark-soft);border-color:var(--mark);color:var(--ink)}
.btn.sel{outline:2px solid var(--accent)}
.answer{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-family:var(--f-read);font-size:15.5px}
.answer p:first-child{margin-top:0}
.answer p:last-child{margin-bottom:0}
.rate{font-size:13px;color:var(--muted)}
.rated-got{border-left:3px solid var(--good)}
.rated-partial{border-left:3px solid var(--warn)}
.rated-miss{border-left:3px solid var(--bad)}

.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;font-family:var(--f-read);font-size:15.5px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin-top:8px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--sunk);margin-bottom:14px}
.score b{font-size:26px;font-variant-numeric:tabular-nums}

/* Review */
.review{max-width:720px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:220px;display:flex;flex-direction:column;gap:14px}
.flash .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.flash .front{font-size:21px;font-weight:600;line-height:1.3;text-wrap:balance}
.flash .back{font-family:var(--f-read);font-size:17px;border-top:1px dashed var(--line);padding-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px;font-weight:600;font-size:14px}
.grade small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.grade.again{border-color:var(--bad)} .grade.good{border-color:var(--accent)}
.decks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--surface)}

.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 6px;font-size:16px}
.panel p{margin:.3em 0;font-size:14.5px}
.method{font-family:var(--f-read);font-size:16.5px;line-height:1.62;max-width:70ch}
.method h3{font-family:var(--f-display);font-size:18px;margin:1.4em 0 .3em}
@media (prefers-reduced-motion: no-preference){.flash{transition:box-shadow .2s}.step-n{transition:background .2s}}
</style>
